server {
 listen 443 ssl;
 http2 on;
 ssl_certificate /etc/letsencrypt/live/agk-edu.ru/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/agk-edu.ru/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 ssl_session_cache shared:agkSSL:10m;
 ssl_session_timeout 1d;
 listen [::]:443 ssl;
 server_name agk-edu.ru;
 root /var/www/agk-main/current;
 index index.html;
 charset utf-8;
 server_tokens off;
 access_log /var/log/nginx/agk-main.access.log;
 error_log /var/log/nginx/agk-main.error.log;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 gzip on;
 gzip_types text/css application/javascript application/json image/svg+xml text/plain;
 gzip_vary on;
 location ^~ /.well-known/acme-challenge/ { root /var/www/acme; try_files $uri =404; }
 location ~ /\. { deny all; }
 location ~* \.(?:php|env|sqlite|db|log|sh)$ { return 404; }
 location ~* \.(?:avif|webp|png|jpe?g|svg|woff2?|mp4|pdf)$ { try_files $uri =404; expires 1h; }
 location / { try_files $uri $uri/ =404; add_header Cache-Control "no-cache"; }
 location /sale2026/ { try_files $uri $uri/ =404; error_page 404 /sale2026/404.html; add_header Cache-Control "no-cache"; }
 location /metodologiya/ { try_files $uri $uri/ =404; error_page 404 /metodologiya/404.html; add_header Cache-Control "no-cache"; }
 location /mentoring/ { try_files $uri $uri/ =404; error_page 404 /mentoring/404.html; add_header Cache-Control "no-cache"; }
 location /method-club/ { try_files $uri $uri/ =404; error_page 404 /method-club/404.html; add_header Cache-Control "no-cache"; }
 location /november/ { try_files $uri $uri/ =404; error_page 404 /november/404.html; add_header Cache-Control "no-cache"; }
 location /premium-programs/ { try_files $uri $uri/ =404; error_page 404 /premium-programs/404.html; add_header Cache-Control "no-cache"; }
 location /archetype/ { try_files $uri $uri/ =404; error_page 404 /archetype/404.html; add_header Cache-Control "no-cache"; }
 location /mentor-consultation/ { try_files $uri $uri/ =404; error_page 404 /mentor-consultation/404.html; add_header Cache-Control "no-cache"; }
 location /web121126/ { try_files $uri $uri/ =404; error_page 404 /web121126/404.html; add_header Cache-Control "no-cache"; }
 location /web121126_r/ { try_files $uri $uri/ =404; error_page 404 /web121126_r/404.html; add_header Cache-Control "no-cache"; }
 location /web121126_short/ { try_files $uri $uri/ =404; error_page 404 /web121126_short/404.html; add_header Cache-Control "no-cache"; }
 location /web121126_r_short/ { try_files $uri $uri/ =404; error_page 404 /web121126_r_short/404.html; add_header Cache-Control "no-cache"; }
 error_page 404 /404.html;
 location = /404.html { internal; }
}

server { listen 80; listen [::]:80; server_name agk-edu.ru www.agk-edu.ru; location ^~ /.well-known/acme-challenge/ { root /var/www/acme; try_files $uri =404; } location / { return 301 https://agk-edu.ru$request_uri; } }
server { listen 443 ssl; listen [::]:443 ssl; server_name www.agk-edu.ru; ssl_certificate /etc/letsencrypt/live/agk-edu.ru/fullchain.pem; ssl_certificate_key /etc/letsencrypt/live/agk-edu.ru/privkey.pem; return 301 https://agk-edu.ru$request_uri; }
